name: JobRadar AI — daily run

on:
  schedule:
    - cron: "0 1 * * *"      # 01:00 UTC = 08:00 เวลาไทย ทุกวัน
  workflow_dispatch: {}        # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write              # ให้ commit digest ที่อัปเดตกลับเข้า repo ได้

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install

      - name: Install Chromium (for Scout)
        run: npx playwright install --with-deps chromium

      - name: Run JobRadar pipeline
        env:
          # เพิ่ม secret นี้ใน repo: Settings → Secrets and variables → Actions
          # ถ้าไม่ใส่ Matcher จะใช้ fallback (keyword) แทน — pipeline ยังรันได้
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node run.mjs

      - name: Commit daily digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ranked-jobs.csv digest.md digest.html remote-dev-jobs.csv
          git diff --staged --quiet || git commit -m "chore: daily job digest ($(date -u +%F))"
          git push
